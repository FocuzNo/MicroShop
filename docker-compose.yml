services:
  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/MicroShop.Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=catalog-db;Port=5432;Database=catalog;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:9092
      Kafka__ProductCreatedTopic: catalog.product-created
    ports:
      - "5001:8080"
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microshop

  inventory-api:
    build:
      context: .
      dockerfile: src/Services/Inventory/MicroShop.Inventory.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=inventory-db;Port=5432;Database=inventory;Username=postgres;Password=postgres
      Kafka__BootstrapServers: kafka:9092
      Kafka__ConsumerGroup: inventory-service
      Kafka__ProductCreatedTopic: catalog.product-created
    ports:
      - "5002:8080"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microshop

  catalog-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microshop

  inventory-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microshop

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - microshop

  prometheus:
    image: prom/prometheus:v3.6.0
    command: --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - catalog-api
      - inventory-api
    networks:
      - microshop

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - microshop

networks:
  microshop:
    name: microshop

volumes:
  catalog-data:
  inventory-data:
  kafka-data:
  prometheus-data:
  grafana-data:
